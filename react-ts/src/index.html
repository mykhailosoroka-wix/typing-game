<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Game</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
</head>
<body>


<div class="difficulty-bar">
    <p id="difficulty-label">Difficulty</p>
    <select id="difficulty">
        <option value="easy" selected>Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>
</div>

    <div id="game-container">
        <div id="game-name">
            <p>👩‍💻 Speed Typer 👨‍💻</p>
        </div>
        <div class="line">
            <p id="timer"></p>
            <p id="score"></p>
        </div>
        <div id="typer-container">
            <p id="type-label">Type the following:</p>
            <p id="target-word"></p>
            <input id="input-word" type="text" placeholder="Type your word here...">
        </div>
    </div>

<div id="game-over-div">
    <p>Time ran out</p>
    <p id="game-over-score"></p>
    <button id="restart-button">Restart</button>
</div>

<script src="js/timer.js"></script>
<script src="js/wordEntry.js"></script>
<script src="js/gameOver.js"></script>
<script src="js/score.js"></script>
<script src="js/main.js"></script>

</body>
</html>
